<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Route Calculator: the same mark as src/shared/brand/AppMark.tsx, on the
       app's panel colour so it holds up as a tab icon. Colours are literal
       here — a favicon is loaded outside the app and cannot read its tokens. -->
  <rect width="32" height="32" rx="7.5" fill="#0b0f0e"/>
  <path d="M7 25.5 L15.5 21.5 L12 13.5 L25 8" fill="none" stroke="#d7ff3c"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7" cy="25.5" r="3.4" fill="#f1f5ef" stroke="#0b0f0e" stroke-width="1.8"/>
  <circle cx="25" cy="8" r="4.2" fill="#f1f5ef" stroke="#0b0f0e" stroke-width="1.8"/>
</svg>
